[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @workspace/db db:push && pnpm --filter @workspace/api-server build"

[deploy]
startCommand = "pnpm --filter @workspace/db db:push && node dist/index.mjs"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "quillhive-api"
